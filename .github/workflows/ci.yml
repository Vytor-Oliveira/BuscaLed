name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — Testes e Cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    # Os testes de auth/garagem são de integração real (sem mock, via
    # supertest) e precisam de um Postgres de verdade — este serviço
    # efêmero do GitHub Actions cobre isso, sem custo. O teste que consulta
    # a API paga da PuxaPlaca fica desligado por padrão (RUN_PAID_API_TESTS
    # não é definido aqui), então nunca roda automaticamente no CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buscaled
          POSTGRES_PASSWORD: buscaled_dev
          POSTGRES_DB: buscaled
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buscaled"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buscaled:buscaled_dev@localhost:5432/buscaled
      JWT_SECRET: ci-only-access-secret-nao-usar-em-producao
      JWT_REFRESH_SECRET: ci-only-refresh-secret-nao-usar-em-producao
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para o SonarCloud analisar corretamente o histórico

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations no Postgres do CI
        run: npx prisma migrate deploy

      - name: Rodar testes com cobertura
        # O limite de cobertura já é aplicado pelo jest.config.js (coverageThreshold) —
        # este comando falha sozinho se a cobertura cair abaixo da meta configurada lá.
        run: npm run test:cov

      - name: Upload do relatório de cobertura (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend-tests:
    name: Frontend — Testes e Cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        # O limite de cobertura já é aplicado pelo vitest.config.ts (coverage.thresholds) —
        # este comando falha sozinho se a cobertura cair abaixo da meta configurada lá.
        # (O passo antigo de checagem extra usava sintaxe --coverageThreshold do Jest,
        # que o Vitest não reconhece — por isso foi removido, não só a meta em si.)
        run: npm run test:cov

      - name: Upload do relatório de cobertura (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  sonarcloud:
    name: SonarCloud — Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download cobertura — backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download cobertura — frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build de verificação
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build backend
        working-directory: ./backend
        run: npm ci && npm run build --if-present

      - name: Build frontend
        working-directory: ./frontend
        run: npm ci && npm run build
