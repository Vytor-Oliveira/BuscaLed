version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: buscaled-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buscaled
      POSTGRES_PASSWORD: buscaled_dev
      POSTGRES_DB: buscaled
    ports:
      - "5432:5432"
    volumes:
      - buscaled_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: buscaled-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  buscaled_pgdata:
